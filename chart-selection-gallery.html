<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图表选型大全：场景、案例与最佳展示方式</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17202a;
      --muted: #667085;
      --line: #d9dee7;
      --soft: #eef2f7;
      --blue: #2f80ed;
      --green: #27ae60;
      --red: #eb5757;
      --orange: #f2994a;
      --purple: #8e5cf7;
      --cyan: #00a8a8;
      --gold: #d6a400;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--bg);
      font: 14px/1.55 "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .94);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto;
      gap: 16px;
      align-items: center;
      max-width: 1440px;
      margin: 0 auto;
      padding: 14px 20px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    input[type="search"] {
      width: min(360px, 42vw);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 11px;
      color: var(--ink);
      background: #fff;
      outline: none;
    }

    select {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 9px 10px;
      color: var(--ink);
      background: #fff;
    }

    main {
      display: grid;
      grid-template-columns: 250px 1fr;
      gap: 18px;
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 36px;
    }

    aside {
      position: sticky;
      top: 83px;
      align-self: start;
      max-height: calc(100vh - 100px);
      overflow: auto;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .nav-title {
      font-weight: 700;
      margin: 2px 0 10px;
    }

    .nav-link {
      display: block;
      color: #344054;
      text-decoration: none;
      padding: 7px 8px;
      border-radius: 6px;
      font-size: 13px;
    }

    .nav-link:hover { background: var(--soft); }

    .legend {
      display: grid;
      grid-template-columns: repeat(4, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }

    .metric {
      min-height: 76px;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .metric strong {
      display: block;
      font-size: 22px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .metric span {
      color: var(--muted);
      font-size: 13px;
    }

    section {
      margin-bottom: 26px;
      scroll-margin-top: 100px;
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin: 4px 0 12px;
    }

    h2 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0;
    }

    .section-note {
      color: var(--muted);
      font-size: 13px;
      max-width: 760px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(260px, 1fr));
      gap: 14px;
    }

    .card {
      display: grid;
      grid-template-rows: auto 190px auto;
      min-height: 382px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }

    .card-head {
      padding: 13px 14px 10px;
      border-bottom: 1px solid var(--soft);
    }

    .card h3 {
      margin: 0 0 5px;
      font-size: 16px;
      letter-spacing: 0;
    }

    .tagline {
      color: var(--muted);
      font-size: 12px;
    }

    .chart {
      position: relative;
      min-height: 190px;
      background:
        linear-gradient(#eef2f7 1px, transparent 1px),
        linear-gradient(90deg, #eef2f7 1px, transparent 1px);
      background-size: 40px 40px;
      background-color: #fbfcfe;
    }

    .chart svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .card-body {
      padding: 12px 14px 14px;
      border-top: 1px solid var(--soft);
    }

    .use {
      margin: 0 0 8px;
      font-weight: 700;
    }

    .desc {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .avoid {
      margin-top: 9px;
      color: #8a5200;
      font-size: 12px;
    }

    .mini-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      font-size: 12px;
    }

    .mini-table th,
    .mini-table td {
      border: 1px solid var(--line);
      padding: 6px 7px;
      text-align: left;
    }

    .mini-table th {
      background: var(--soft);
    }

    .hidden { display: none !important; }

    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 8px;
      color: var(--muted);
      font-size: 12px;
      background: #fff;
    }

    .quick {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .quick .card {
      min-height: auto;
      grid-template-rows: auto;
      padding: 13px;
    }

    .quick strong { font-size: 15px; }
    .quick p { margin: 7px 0 0; color: var(--muted); font-size: 13px; }

    @media (max-width: 1120px) {
      main { grid-template-columns: 1fr; }
      aside { position: static; max-height: none; }
      .grid { grid-template-columns: repeat(2, minmax(260px, 1fr)); }
      .legend, .quick { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 720px) {
      .topbar { grid-template-columns: 1fr; }
      .toolbar { justify-content: stretch; }
      input[type="search"], select { width: 100%; }
      .grid, .legend, .quick { grid-template-columns: 1fr; }
      main { padding: 14px 12px 26px; }
      .card { grid-template-rows: auto 170px auto; }
    }

    @media print {
      header, aside { position: static; }
      main { display: block; }
      .grid { grid-template-columns: repeat(2, 1fr); }
      .card { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>图表选型大全：场景、案例与最佳展示方式</h1>
        <div class="subtitle">从股票资金流到项目管理、经营分析、知识图谱，一页看懂什么场景该用什么图。</div>
      </div>
      <div class="toolbar">
        <input id="search" type="search" placeholder="搜索：资金流、排名、趋势、桑基图、K线..." />
        <select id="category">
          <option value="all">全部场景</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <aside>
      <div class="nav-title">目录</div>
      <div id="nav"></div>
    </aside>

    <div>
      <div class="legend">
        <div class="metric"><strong>64</strong><span>张示例图，覆盖常见业务和分析场景</span></div>
        <div class="metric"><strong>17</strong><span>类场景：金融、经营、用户、项目、知识管理等</span></div>
        <div class="metric"><strong>0</strong><span>外部依赖，双击 HTML 即可打开</span></div>
        <div class="metric"><strong>1</strong><span>套选图口诀：趋势、排名、占比、流向、分布、关系</span></div>
      </div>

      <div class="quick">
        <div class="card"><strong>看趋势</strong><p>折线图、面积图、阶梯图、K线图。</p></div>
        <div class="card"><strong>看对比/排名</strong><p>条形图、分组柱、动态排名、坡度图。</p></div>
        <div class="card"><strong>看结构/占比</strong><p>环形图、堆叠图、矩形树图、旭日图。</p></div>
        <div class="card"><strong>看流向/路径</strong><p>桑基图、漏斗图、用户路径图、迁徙图。</p></div>
      </div>

      <div id="sections"></div>
    </div>
  </main>

  <script>
    const palette = {
      blue: "#2f80ed",
      green: "#27ae60",
      red: "#eb5757",
      orange: "#f2994a",
      purple: "#8e5cf7",
      cyan: "#00a8a8",
      gold: "#d6a400",
      gray: "#98a2b3",
      dark: "#344054"
    };

    const sections = [
      {
        id: "stock",
        name: "股票 / 资金流 / 金融行情",
        note: "适合多维、实时、动态、强弱对比。股票类分析通常需要把价格、资金、成交量、板块、时间放在一起看。",
        charts: [
          ["动态气泡图", "板块资金轮动", "同时看涨跌幅、资金净流入、成交额和时间变化。", "类别过多时要加筛选或播放控制。", "bubbleMotion", ["资金", "板块", "动态"]],
          ["桑基图", "资金从题材 A 流向题材 B", "展示资金迁移、用户路径、订单流转最直观。", "不适合没有明确来源和去向的数据。", "sankey", ["资金", "流向"]],
          ["K线图", "个股日内/日线价格走势", "开高低收和趋势结构一眼可见。", "不适合非金融用户的初学汇报。", "candlestick", ["股票", "趋势"]],
          ["K线 + 成交量", "价格和量能一起复盘", "判断放量上涨、缩量回调、突破有效性。", "量价维度太多时要拆成上下两栏。", "candleVolume", ["股票", "量价"]],
          ["板块热力图", "全市场涨跌强弱", "用颜色表达涨跌，用面积表达市值或成交额。", "颜色规则必须稳定，红绿含义不能混。", "treemapHeat", ["股票", "热力"]],
          ["资金双轴图", "价格与主力资金联动", "一条轴看股价，一条轴看资金净流入。", "双轴容易误导，要标清单位。", "dualAxis", ["资金", "趋势"]],
          ["相关性热力图", "板块或个股联动", "快速识别同涨同跌、风险集中度。", "相关不代表因果。", "corrHeatmap", ["股票", "关系"]],
          ["四象限图", "涨幅 + 资金流强弱", "把股票分为强势流入、弱势流入、强势流出、弱势流出。", "轴的阈值要有业务依据。", "quadrant", ["资金", "对比"]],
          ["瀑布图", "组合收益归因", "看收益由哪些股票、行业或因子贡献。", "项目太多时只保留 Top N。", "waterfall", ["收益", "拆解"]],
          ["动态排名条形图", "热门板块排名变化", "展示一段时间内龙头或热点轮动。", "变化太快时会影响阅读。", "barRace", ["排名", "动态"]]
        ]
      },
      {
        id: "trend",
        name: "趋势 / 时间变化",
        note: "只要核心问题是“随着时间如何变化”，优先从折线图、面积图、日历热力图、阶梯图里选。",
        charts: [
          ["折线图", "月收入、指数、用户增长", "连续趋势最清楚，适合看方向、斜率和拐点。", "线太多会打结，超过 5 条要拆分。", "line", ["趋势"]],
          ["面积图", "累计用户或流量变化", "强调总量随时间累积或扩张。", "不适合精准比较多个系列。", "area", ["趋势", "总量"]],
          ["堆叠面积图", "多来源流量构成随时间变化", "看总体趋势和内部结构同步变化。", "底部以外的系列不适合看精确趋势。", "stackedArea", ["趋势", "结构"]],
          ["阶梯图", "价格档位、版本发布、政策变化", "适合非连续变化或阶段性生效的指标。", "不适合平滑连续过程。", "step", ["趋势", "阶段"]],
          ["日历热力图", "每天活跃度、收益、打卡", "能快速发现周期性和异常日期。", "不适合展示精确数值。", "calendar", ["时间", "热力"]],
          ["河流图", "长期话题热度演化", "适合看主题兴衰、舆情流动。", "主题过多会变成彩带。", "stream", ["趋势", "文本"]]
        ]
      },
      {
        id: "rank",
        name: "排名 / 对比 / 差异",
        note: "排名优先条形图；前后变化用坡度图、哑铃图；目标完成用子弹图。",
        charts: [
          ["横向条形图", "主力资金净流入 Top10", "名称长、排名多时比竖柱更好读。", "不要用 3D 柱。", "hbar", ["排名"]],
          ["分组柱状图", "今年 vs 去年、A 产品 vs B 产品", "适合少量类别的并列对比。", "类别多时改横向条形。", "groupedBar", ["对比"]],
          ["堆叠柱状图", "收入由不同产品组成", "对比总量和内部结构。", "只适合看总量和大致构成。", "stackedBar", ["结构", "对比"]],
          ["百分比堆叠图", "渠道占比横向比较", "每组统一为 100%，看结构差异。", "看绝对规模时不要用。", "percentStack", ["占比", "对比"]],
          ["坡度图", "政策前后排名变化", "看两个时间点之间谁上升、谁下降。", "超过 15 条会拥挤。", "slope", ["变化"]],
          ["哑铃图", "目标值 vs 实际值", "清楚展示两个点之间的差距。", "不适合多时间点。", "dumbbell", ["差异"]],
          ["子弹图", "KPI 完成率", "比仪表盘更省空间，能看实际、目标和区间。", "需要解释刻度含义。", "bullet", ["KPI"]]
        ]
      },
      {
        id: "share",
        name: "结构 / 占比 / 层级",
        note: "看“部分与整体”的关系。类别少用环形图，层级多用矩形树图或旭日图。",
        charts: [
          ["环形图", "用户来源占比", "少量分类的占比展示清爽。", "超过 5 类时换条形图。", "donut", ["占比"]],
          ["玫瑰图", "季节、方向、周期分布", "适合带角度或周期感的分类占比。", "不要为了好看替代普通排名。", "rose", ["占比", "周期"]],
          ["矩形树图", "投资组合仓位结构", "面积表达占比，非常适合股票持仓和收入构成。", "小块太多时要聚合。", "treemap", ["结构"]],
          ["旭日图", "公司-部门-业务层级", "展示多层级结构和占比。", "层级太深会难读。", "sunburst", ["层级"]],
          ["马赛克图", "两类变量的组合占比", "同时看两个分类维度的结构。", "需要明确宽高分别代表什么。", "mosaic", ["结构", "关系"]]
        ]
      },
      {
        id: "distribution",
        name: "分布 / 波动 / 异常",
        note: "当问题是“数据集中在哪里、离散程度多大、有没有异常值”，用分布类图。",
        charts: [
          ["直方图", "订单金额、股票收益分布", "看数据集中区间和偏态。", "箱数选择会影响结论。", "histogram", ["分布"]],
          ["密度图", "用户年龄或收益率密度", "比直方图更平滑，适合看形态。", "样本小的时候容易误导。", "density", ["分布"]],
          ["箱线图", "不同板块估值分布", "看中位数、四分位、异常值。", "非数据用户需要图例解释。", "boxplot", ["分布", "异常"]],
          ["小提琴图", "多组分布形态对比", "同时看密度和集中区间。", "不适合少量样本。", "violin", ["分布"]],
          ["控制图", "指标异常监控", "用均值和控制线判断异常波动。", "控制线不能随意拍脑袋。", "control", ["监控", "异常"]],
          ["蜂群图", "小样本个体分布", "每个点都保留，适合小数据透明展示。", "数据太多时换密度图。", "beeswarm", ["分布"]]
        ]
      },
      {
        id: "relationship",
        name: "关系 / 相关性 / 多变量",
        note: "两个变量用散点，三个变量用气泡，多变量用平行坐标或雷达，关系网络用节点图。",
        charts: [

          ["气泡图", "收益、风险、规模", "第三变量用大小表达，适合金融和城市分析。", "气泡面积不要夸大差异。", "bubble", ["多维"]],
          ["雷达图", "能力模型或竞品对比", "少量对象、多维指标的轮廓对比。", "维度超过 8 个会难读。", "radar", ["多维"]],
          ["平行坐标图", "多指标股票筛选", "适合看多维特征和异常路径。", "需要交互筛选，否则很乱。", "parallel", ["多维"]],
          ["网络图", "团队协作、知识关联", "展示节点之间的连接关系。", "不适合表达精确数值。", "network", ["关系"]],
          ["知识图谱", "概念、人物、项目关系", "比普通网络图更强调语义节点和标签。", "要控制节点层级。", "knowledge", ["知识"]]
        ]
      },
      {
        id: "flow",
        name: "流程 / 路径 / 转化",
        note: "有开始、过程、去向、流失，就从漏斗图、桑基图、流程图、路径图里选。",
        charts: [
          ["漏斗图", "访问-注册-下单-支付", "每一步转化和流失最清楚。", "不适合非线性路径。", "funnel", ["转化"]],
          ["用户路径图", "首页到购买的行为链路", "看关键路径和分叉。", "路径太多时要聚合。", "path", ["路径"]],

          ["时序图", "系统调用链路", "适合接口、服务、角色之间的先后关系。", "不适合组织层级。", "sequence", ["系统"]],
          ["决策树", "风控审批或诊断逻辑", "展示条件判断和分支结果。", "深度太大时很难维护。", "decisionTree", ["决策"]],
          ["DAG 图", "数据处理任务依赖", "适合 ETL、AI pipeline、任务编排。", "有环关系不能用 DAG。", "dag", ["流程"]]
        ]
      },
      {
        id: "project",
        name: "项目管理 / 计划 / 组织",
        note: "项目类图表要服务于行动：谁负责、何时完成、哪里延期、风险多大。",
        charts: [
          ["甘特图", "项目排期和任务依赖", "任务跨度、并行关系、延期一目了然。", "细节过多时按阶段折叠。", "gantt", ["项目"]],
          ["时间轴", "里程碑、版本、事件", "讲清楚关键节点的先后顺序。", "不适合展示持续任务。", "timeline", ["项目", "时间"]],

      const svg = makeSvg();
      for(let r=0;r<6;r++) for(let c=0;c<7;c++) {
        const opacity = Math.max(.15, .9 - c*.11 - r*.03);
        svg.appendChild(svgEl("rect",{x:62+c*30,y:24+r*22,width:26,height:18,fill:`rgba(47,128,237,${opacity})`,rx:3}));
      }
      addText(svg,"留存 Cohort",160,166,11,palette.muted);
      return svg;
    }

    function drawClickHeat() {
      const svg = makeSvg();
      svg.appendChild(svgEl("rect",{x:54,y:24,width:210,height:132,rx:6,fill:"#fff",stroke:"#d9dee7"}));
      [["导航",82,44,54,16],["按钮",190,116,72,26],["表单",146,72,92,26]].forEach(r=>{svg.appendChild(svgEl("rect",{x:r[1],y:r[2],width:r[3],height:r[4],rx:4,fill:"#eef2f7"})); addText(svg,r[0],r[1]+r[3]/2,r[2]+12,9,palette.muted);});
      [[208,128,34],[158,84,26],[104,50,18]].forEach(p=>svg.appendChild(svgEl("circle",{cx:p[0],cy:p[1],r:p[2],fill:"rgba(235,87,87,.25)"})));
      return svg;
    }

    function drawProfitWaterfall() { return drawWaterfall(); }

    function drawFeatureMatrix() {
      const svg = makeSvg();
      const rows=["搜索","导出","协作","AI"], cols=["我方","竞品A","竞品B","竞品C"];
      cols.forEach((c,i)=>addText(svg,c,88+i*52,26,9,palette.dark));
      rows.forEach((r,i)=>{addText(svg,r,54,54+i*26,9,palette.dark,"end"); cols.forEach((c,j)=>{const on=(i+j)%3!==1; svg.appendChild(svgEl("rect",{x:72+j*52,y:42+i*26,width:30,height:18,rx:3,fill:on?palette.green:"#eef2f7"})); if(on)addText(svg,"✓",87+j*52,56+i*26,12,"#fff");});});
      return svg;
    }

    function drawNps() {
      const svg = makeSvg(); axes(svg);
      [["贬损",88,palette.red],["中立",64,palette.orange],["推荐",118,palette.green]].forEach((b,i)=>{svg.appendChild(svgEl("rect",{x:72+i*70,y:150-b[1],width:42,height:b[1],fill:b[2]})); addText(svg,b[0],93+i*70,166,10,palette.dark);});
      return svg;
    }

    function drawBCG() { return drawQuadrant(); }
    function drawOpportunity() { return drawQuadrant(); }
    function drawPerceptual() { return drawScatter(); }

    function drawSwot() {
      const svg = makeSvg();
      [["S 优势",42,28,palette.green],["W 劣势",166,28,palette.orange],["O 机会",42,96,palette.blue],["T 威胁",166,96,palette.red]].forEach(b=>{svg.appendChild(svgEl("rect",{x:b[1],y:b[2],width:112,height:52,rx:6,fill:b[3],opacity:.82})); addText(svg,b[0],b[1]+56,b[2]+31,14,"#fff");});
      return svg;
    }

    function drawWordCloud() {
      const svg = makeSvg();
      [["AI",42,74,28,palette.blue],["Obsidian",116,54,20,palette.purple],["资金流",178,98,18,palette.red],["复盘",224,62,22,palette.green],["增长",88,124,16,palette.orange],["知识库",202,132,15,palette.cyan],["Claude",146,118,19,palette.gold]].forEach(w=>addText(svg,w[0],w[1],w[2],w[3],w[4]));
      return svg;
    }

    function drawSentiment() {
      const svg = makeSvg(); axes(svg);
      svg.appendChild(svgEl("path",{d:"M42,112 L82,94 L122,76 L162,68 L202,88 L242,54 L286,38",stroke:palette.green,"stroke-width":3,fill:"none"}));
      svg.appendChild(svgEl("path",{d:"M42,78 L82,84 L122,104 L162,116 L202,96 L242,118 L286,130",stroke:palette.red,"stroke-width":3,fill:"none"}));
      addText(svg,"正/负面",164,28,12,palette.dark);
      return svg;
    }

    function drawCooccur() {
      const svg = drawNetwork();
      addText(svg,"关键词共现",160,166,11,palette.muted);
      return svg;
    }

    function drawMindmap() {
      const svg = makeSvg();
      const center=[78,88,"主题"], nodes=[[174,36,"概念"],[214,74,"案例"],[190,118,"方法"],[250,146,"行动"]];
      nodes.forEach(n=>svg.appendChild(svgEl("path",{d:`M${center[0]+34},${center[1]} C130,${center[1]} ${n[0]-50},${n[1]} ${n[0]-34},${n[1]}`,stroke:palette.blue,"stroke-width":2,fill:"none"})));
      [center,...nodes].forEach((n,i)=>{svg.appendChild(svgEl("rect",{x:n[0]-34,y:n[1]-14,width:68,height:28,rx:6,fill:i?palette.green:palette.orange})); addText(svg,n[2],n[0],n[1]+4,10,"#fff");});
      return svg;
    }

    function drawTagTree() { return drawTreemap(); }

    const drawers = {
      line: drawLine, area: drawArea, stackedArea: drawStackedArea, step: drawStep, hbar: drawHBar,
      groupedBar: drawGroupedBar, stackedBar: drawStackedBar, percentStack: drawPercentStack, donut: drawDonut,
      rose: drawRose, treemap: drawTreemap, sunburst: drawSunburst, mosaic: drawMosaic, treemapHeat: drawTreemapHeat,
      scatter: drawScatter, bubble: drawBubble, bubbleMotion: drawBubbleMotion, sankey: drawSankey, funnel: drawFunnel,
      candlestick: drawCandlestick, candleVolume: drawCandleVolume, dualAxis: drawDualAxis, corrHeatmap: drawCorrHeatmap,
      quadrant: drawQuadrant, waterfall: drawWaterfall, barRace: drawBarRace, calendar: drawCalendar, stream: drawStream,
      slope: drawSlope, dumbbell: drawDumbbell, bullet: drawBullet, histogram: drawHistogram, density: drawDensity,
      boxplot: drawBoxplot, violin: drawViolin, control: drawControl, beeswarm: drawBeeswarm, radar: drawRadar,
      parallel: drawParallel, network: drawNetwork, knowledge: drawKnowledge, path: drawPath, flowchart: drawFlowchart,
      sequence: drawSequence, decisionTree: drawDecisionTree, dag: drawDag, gantt: drawGantt, timeline: drawTimeline,
      burndown: drawBurndown, riskMatrix: drawRiskMatrix, org: drawOrg, nineBox: drawNineBox, choropleth: drawChoropleth,
      dotMap: drawDotMap, geoHeat: drawGeoHeat, flowMap: drawFlowMap, dashboard: drawDashboard, cohort: drawCohort,
      clickHeat: drawClickHeat, profitWaterfall: drawProfitWaterfall, featureMatrix: drawFeatureMatrix, nps: drawNps,
      bcg: drawBCG, opportunity: drawOpportunity, perceptual: drawPerceptual, swot: drawSwot, wordCloud: drawWordCloud,
      sentiment: drawSentiment, cooccur: drawCooccur, mindmap: drawMindmap, tagTree: drawTagTree
    };

    function render() {
      const nav = document.getElementById("nav");
      const category = document.getElementById("category");
      const root = document.getElementById("sections");
      sections.forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id; opt.textContent = s.name;
        category.appendChild(opt);
        const a = document.createElement("a");
        a.href = `#${s.id}`; a.className = "nav-link"; a.textContent = s.name;
        nav.appendChild(a);

        const section = document.createElement("section");
        section.id = s.id;
        section.dataset.category = s.id;
        section.innerHTML = `<div class="section-head"><div><h2>${s.name}</h2><div class="section-note">${s.note}</div></div><span class="pill">${s.charts.length} 个案例</span></div><div class="grid"></div>`;
        const grid = section.querySelector(".grid");
        s.charts.forEach(c => grid.appendChild(card(s, c)));
        root.appendChild(section);
      });
    }

    function card(section, c) {
      const [title, use, desc, avoid, kind, tags] = c;
      const el = document.createElement("article");
      el.className = "card";
      el.dataset.category = section.id;
      el.dataset.search = `${section.name} ${title} ${use} ${desc} ${avoid} ${tags.join(" ")}`.toLowerCase();
      el.innerHTML = `<div class="card-head"><h3>${title}</h3><div class="tagline">${tags.map(t=>`#${t}`).join(" ")}</div></div><div class="chart"></div><div class="card-body"><p class="use">${use}</p><p class="desc">${desc}</p><div class="avoid">避坑：${avoid}</div></div>`;
      const chart = el.querySelector(".chart");
      chart.appendChild((drawers[kind] || drawLine)());
      return el;
    }

    function filter() {
      const q = document.getElementById("search").value.trim().toLowerCase();
      const cat = document.getElementById("category").value;
      document.querySelectorAll("section").forEach(section => {
        let visibleCount = 0;
        section.querySelectorAll(".card").forEach(card => {
          const okCat = cat === "all" || card.dataset.category === cat;
          const okText = !q || card.dataset.search.includes(q);
          const show = okCat && okText;
          card.classList.toggle("hidden", !show);
          if (show) visibleCount++;
        });
        section.classList.toggle("hidden", visibleCount === 0);
      });
    }

    render();
    document.getElementById("search").addEventListener("input", filter);
    document.getElementById("category").addEventListener("change", filter);
  </script>
</body>
</html>
